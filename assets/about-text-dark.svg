  <title id="t">À propos · About</title>
  <desc id="d">Étudiant en E-business à la HEPH-Condorcet de Tournai, en Belgique. J'imagine et je conçois des expériences digitales modernes qui combinent design, développement et image : sites web, identités visuelles, contenus photo et vidéo. E-business student at HEPH-Condorcet in Tournai, Belgium. I design and build modern digital experiences that combine design, development and imagery: websites, visual identities, photo and video content.</desc>
