<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Luca Di Stefano</title>
  <desc id="d">Étudiant en E-business. Design UX/UI, identité visuelle, développement web, marketing digital.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a2845"/>
    </pattern>
    <linearGradient id="orb" gradientUnits="userSpaceOnUse" x1="1010" y1="110" x2="1010" y2="335">
      <stop offset="0" stop-color="#397ff6"/>
      <stop offset="0.6" stop-color="#1754b8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1754b8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 68px; font-weight: 700; letter-spacing: -1px; fill: #e9e7e1; }
    .role { font-size: 22px; fill: #b7b6b0; }
    .l { font-size: 28px; fill: #5b9bff; opacity: 0; animation: cycle 12s infinite both; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    .l4 { animation-delay: 9s; }
    .orb { animation: float 8s ease-in-out infinite alternate; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      3%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .l, .orb, .ring { animation: none; }
      .l { opacity: 0; }
      .l1 { opacity: 1; }
    }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#0b1424"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <g class="orb">
      <circle class="ring" cx="1010" cy="360" r="292" fill="none" stroke="#e9e7e1" stroke-opacity="0.16" stroke-dasharray="3 9"/>
      <circle cx="1010" cy="360" r="250" fill="url(#orb)"/>
    </g>
    <text class="name" x="58" y="130">LUCA DI STEFANO</text>
    <text class="role" x="60" y="182">Étudiant en E-business · E-business student</text>
    <text class="l l1" x="60" y="236"><tspan fill="#8a8a86">/ </tspan>Design UX/UI</text>
    <text class="l l2" x="60" y="236"><tspan fill="#8a8a86">/ </tspan>Identité visuelle · Branding</text>
    <text class="l l3" x="60" y="236"><tspan fill="#8a8a86">/ </tspan>Développement web · Web dev</text>
    <text class="l l4" x="60" y="236"><tspan fill="#8a8a86">/ </tspan>Marketing digital · Digital marketing</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#e9e7e1" stroke-opacity="0.15"/>
</svg>
