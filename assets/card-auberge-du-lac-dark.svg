    <text class="fr" x="36" y="146">Identité visuelle d'un restaurant à Péronnes :</text><text class="fr" x="36" y="168">cartes de visite, menus, bons cadeaux.</text>
    <text class="en" x="36" y="200">Visual identity for a restaurant in Péronnes:</text><text class="en" x="36" y="221">business cards, menus, gift vouchers.</text>
