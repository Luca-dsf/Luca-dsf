<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
  <title id="t">L'Auberge du Lac</title>
  <desc id="d">L'Auberge du Lac. Identité visuelle d'un restaurant à Péronnes : cartes de visite, menus, bons cadeaux. Visual identity for a restaurant in Péronnes: business cards, menus, gift vouchers.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a2845"/>
    </pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1754b8"/>
      <stop offset="1" stop-color="#397ff6"/>
    </linearGradient>
    <clipPath id="round"><rect width="600" height="300" rx="16"/></clipPath>
    <clipPath id="tileclip"><rect x="476" y="28" width="88" height="88" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cat { font-size: 14px; letter-spacing: 0.5px; fill: #8a8a86; }
    .idx { fill: #5b9bff; font-weight: 700; }
    .title { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; fill: #e9e7e1; }
    .fr { font-size: 18px; fill: #e9e7e1; }
    .en { font-size: 17px; font-style: italic; fill: #b7b6b0; }
    .chip { font-size: 13px; fill: #b7b6b0; }
    .mono { font-size: 34px; font-weight: 700; fill: #f4f3ef; }
    .orb { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-14px, -10px); } }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
  </style>
