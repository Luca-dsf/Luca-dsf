name: generate snake animation

on:
  # tous les jours à 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # permet de lancer le workflow à la main (onglet Actions)
  workflow_dispatch:

  # à chaque modification de la branche main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # génère l'animation à partir du graphe de contributions de github_user_name
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1754b8&color_dots=#ebedf0,#c6d9fb,#8ab4f8,#397ff6,#1754b8
            dist/github-snake-dark.svg?color_snake=#397ff6&color_dots=#161b22,#0e2a5c,#16479a,#2563eb,#397ff6

      # pousse le contenu de dist/ sur la branche "output"
      # fichiers disponibles sur https://raw.githubusercontent.com/<user>/<repo>/output/<fichier>
      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
